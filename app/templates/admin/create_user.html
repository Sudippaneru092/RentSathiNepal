{% extends "admin/admin_base.html" %}

{% block admin_breadcrumb %}Users / Create New{% endblock %}

{% block admin_content %}
<div class="d-flex align-items-center justify-content-between mb-4">
    <h4 class="fw-bold mb-0">Create New User</h4>
    <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Back to List
    </a>
</div>

<div class="row">
    <div class="col-lg-8 mx-auto">
        <form method="POST" class="card border-0 shadow-sm">
            <div class="card-body p-4">
                
                <!-- Section 1: Account & Role -->
                <h5 class="text-primary mb-3"><i class="bi bi-shield-lock me-2"></i>Account & Role</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Full Name</label>
                        <input type="text" name="full_name" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" required minlength="8">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Assign Role</label>
                        <select name="role" class="form-select" required>
                            <option value="user">Tenant (User)</option>
                            <option value="admin">Administrator</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Account Status</label>
                        <select name="account_status" class="form-select">
                            <option value="active">Active</option>
                            <option value="suspended">Suspended</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Phone Number</label>
                        <input type="text" name="phone" class="form-control">
                    </div>
                </div>

                <!-- Section 2: Personal Details -->
                <h5 class="text-primary mb-3"><i class="bi bi-person me-2"></i>Personal Details</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label small fw-bold">Gender</label>
                        <select name="gender" class="form-select">
                            <option value="">Select</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label small fw-bold">Occupation</label>
                        <input type="text" name="occupation" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold">Province</label>
                        <input type="text" name="province" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold">District</label>
                        <input type="text" name="district" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold">City</label>
                        <input type="text" name="city" class="form-control">
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-bold">Address</label>
                        <textarea name="address" class="form-control" rows="2"></textarea>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">Create User Account</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
